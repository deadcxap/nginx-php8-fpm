name: Build, test and publish images

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

# Serialize releases so an older build cannot overwrite a newer latest tag.
concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.target }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [with-node, without-node]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: local/nginx-php8-fpm:${{ matrix.target }}-${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      PLATFORM: linux/${{ matrix.arch }}
      IMAGE_SOURCE: https://github.com/${{ github.repository }}
      IMAGE_REVISION: ${{ github.sha }}
      IMAGE_VERSION: build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Test publication logic
        run: python3 tests/publish-check.py
      - name: Build with fresh dependencies
        run: ./build.sh --progress=plain
      - name: Record installed versions
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          ./scripts/image-info.sh "$IMAGE" > "$RUNNER_TEMP/reports/versions.txt" 2>&1
      - name: Test the container
        run: ./scripts/smoke-test.sh "$IMAGE" "$TARGET"
      - name: Export the tested image and its version tag
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm "$IMAGE" runtime-info --tag > "$RUNNER_TEMP/image-$TARGET-$ARCH.tag"
          docker image save --output "$RUNNER_TEMP/image-$TARGET-$ARCH.tar" "$IMAGE"
      - name: Scan for vulnerabilities
        env:
          ARCH: ${{ matrix.arch }}
        run: ./scripts/scan-image.sh "$RUNNER_TEMP/image-$TARGET-$ARCH.tar" "$RUNNER_TEMP/reports"
      - name: Save version and vulnerability reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/reports/versions.txt
            ${{ runner.temp }}/reports/trivy.json
          retention-days: 30
      - name: Pass the tested image to the publishing job
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/image-${{ matrix.target }}-${{ matrix.arch }}.tar
            ${{ runner.temp }}/image-${{ matrix.target }}-${{ matrix.arch }}.tag
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish tested images to GHCR
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish without rebuilding
        env:
          REPOSITORY: ${{ github.repository }}
        run: ./scripts/publish-images.sh "$RUNNER_TEMP/images"
